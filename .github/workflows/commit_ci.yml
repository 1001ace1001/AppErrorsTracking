name: Build API102 APK
on:
  workflow_dispatch:
  push:
    branches: [api102-migration]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set CI version suffix
        run: echo "GITHUB_CI_COMMIT_ID=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Test and build module
        run: ./gradlew :module-app:testDebugUnitTest :module-app:assembleDebug --no-daemon --console=plain --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AppErrorsTracking-API102-debug
          path: module-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: API102-test-reports
          path: |
            module-app/build/reports/tests/
            module-app/build/test-results/
          if-no-files-found: ignore